name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  launcher:
    name: launcher-macos
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run launcher quality gate
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          MHG_ALLOW_AD_HOC_SIGNING: "1"
        run: scripts/test-launcher.sh
