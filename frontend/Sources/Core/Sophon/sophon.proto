syntax = "proto3";

message AssetChunk {
  string chunk_name = 1;
  string chunk_decompressed_hash_md5 = 2;
  int64 chunk_on_file_offset = 3;
  int64 chunk_size = 4;
  int64 chunk_size_decompressed = 5;
}

message AssetProperty {
  string asset_name = 1;
  repeated AssetChunk asset_chunks = 2;
  int32 asset_type = 3;
  int64 asset_size = 4;
  string asset_hash_md5 = 5;
}

message SophonManifest {
  repeated AssetProperty assets = 1;
}

message PatchInfo {
  string id = 1;
  int64 patch_file_size = 4;
  int64 patch_start_offset = 6;
  int64 patch_length = 7;
  string original_file_name = 8;
}

message PatchesEntry {
  string key = 1;
  PatchInfo patch_info = 2;
}

message PatchFileData {
  string file_name = 1;
  int64 file_size = 2;
  string file_hash = 3;
  repeated PatchesEntry patches_entries = 4;
}

message FileInfo {
  string name = 1;
}

message DeleteFiles {
  repeated FileInfo infos = 1;
}

message DeleteFilesEntry {
  string key = 1;
  DeleteFiles delete_files = 2;
}

message PatchManifest {
  repeated PatchFileData file_datas = 1;
  repeated DeleteFilesEntry delete_files_entries = 2;
}
